services:
  api:
    build: ./api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    networks:
      - backend
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - backend
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
  test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
  interval: 5s
  timeout: 3s
  retries: 5

networks:
  backend:
